<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>open-browser 控制台</title>
<link rel="icon" type="image/png" href="icons/open-browser-32.png">
<link rel="stylesheet" href="newtab.css">
<script defer src="phase-labels.js"></script>
<script defer src="workspace-title.js"></script>
<script defer src="newtab.js"></script>
<body>
  <header><div class="brand"><img src="icons/open-browser-48.png" width="28" height="28" alt=""><strong>open-browser</strong></div><span id="status">正在连接…</span></header>
  <main>
    <section class="hero"><div><h1>Agent 控制台</h1><p>查看 Agent 当前任务和运行记录。</p></div><button id="refresh" class="quiet" type="button">刷新</button></section>
    <section class="how-to"><div class="section-title"><h2>Agent 如何使用</h2><button id="copy-prompt" class="quiet" type="button">复制提示词</button></div><p>把下面的提示词交给 Agent，它会按 open-browser 的安全流程操作浏览器。</p><textarea id="agent-prompt" readonly spellcheck="false">请使用 open-browser Skill 控制浏览器。先调用 listWorkspaces，继续已有工作区。创建新任务时必须填写清晰的 name 任务名称和 agentName Agent 名称，再用 open 打开明确网址，按 observe → act → getOperation → observe 核对结果，完成后调用 finishWorkspace。遇到接管、stale_ref、outcome_unknown 或 host_unavailable 时，按返回的 nextAction 处理，不要重复提交。</textarea></section>
    <section><div class="section-title"><h2>正在运行的 Agent</h2><span id="workspace-count"></span></div><div id="workspaces" class="workspace-grid"></div><p id="empty" class="empty">当前没有正在运行的 Agent。</p></section>
    <section><div class="section-title"><h2>运行历史</h2><span id="history-count"></span></div><div id="history" class="history-list"></div><p id="history-empty" class="empty">暂无运行历史。</p></section>
    <p id="notice" role="status" hidden></p>
  </main>
</body>
